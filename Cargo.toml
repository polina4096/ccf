[package]
name = "ccf"
version = "0.1.1"
edition = "2024"
rust-version = "1.100"
description = "Search your local Claude Code conversations from the terminal"
keywords = ["claude", "tui", "search"]
categories = ["command-line-utilities"]
repository = "https://github.com/polina4096/ccf"
readme = "README.md"
license = "Unlicense"

[lints.clippy]
# Stylistic
self_named_module_files = "deny"
needless_return = "allow"
single_match = "allow"

# Annoying default lints
uninlined_format_args = "allow" # Inconsistency with complex format args
new_without_default = "allow"   # Not all types make sense with default

# Safety
await_holding_invalid_type = "deny"
await_holding_refcell_ref = "deny"
await_holding_lock = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"

[profile.release]
codegen-units = 1
lto = "fat"

[profile.dev]
opt-level = 1
lto = "off"
codegen-units = 256
overflow-checks = false

[profile.dev.package."*"]
opt-level = 3
overflow-checks = false

[dependencies]
anyhow = "1"
arboard = "3"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
documented = "0.10.0"
edit = "0.1.5"
etcetera = "0.11.0"
figment2 = { version = "0.11.5", features = ["toml", "env"] }
fs-err = "3"
jiff = { version = "0.2", features = ["serde"] }
memchr = "2"
memmap2 = "0.9"
nucleo = "0.5"
ratatui = "0.30"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
smart-default = "0.7.1"
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
toml_edit = { version = "0.25.19", features = ["serde"] }
tui-input = { version = "0.15.5", default-features = false }
unicode-truncate = "2"
unicode-width = "0.2"
